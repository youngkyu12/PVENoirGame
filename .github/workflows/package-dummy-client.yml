name: Package Dummy Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package-dummy-client:
    runs-on: windows-latest

    env:
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64
      SERVER_SOLUTION: GameServer\GameServer.sln
      DUMMY_CLIENT_OUTPUT: GameServer\x64\Release
      DUMMY_CLIENT_EXE: DummyClient.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify native build dependencies
        shell: powershell
        run: |
          $requiredFiles = @(
              "Libraries\Libs\Protobuf\Release\libprotobuf.lib",
              "Libraries\Libs\Protobuf\Release\libprotobuf.dll"
          )

          foreach ($file in $requiredFiles) {
              if (-not (Test-Path $file)) {
                  throw "Required native build dependency was not found: $file"
              }
          }

      - name: Restore server solution
        run: msbuild "${{ env.SERVER_SOLUTION }}" /t:Restore

      - name: Build dummy client
        run: >
          msbuild "${{ env.SERVER_SOLUTION }}"
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}

      - name: Create dummy client package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Executable\DummyClient"

          Copy-Item `
            "${{ env.DUMMY_CLIENT_OUTPUT }}\${{ env.DUMMY_CLIENT_EXE }}" `
            "Executable\DummyClient\${{ env.DUMMY_CLIENT_EXE }}" `
            -Force

          Get-ChildItem `
            -Path "${{ env.DUMMY_CLIENT_OUTPUT }}" `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
          Copy-Item `
            -Destination "Executable\DummyClient" `
            -Force

          Copy-Item `
            "Libraries\Libs\Protobuf\Release\libprotobuf.dll" `
            "Executable\DummyClient\libprotobuf.dll" `
            -Force

          @'
          @echo off
          cd /d "%~dp0DummyClient"
          DummyClient.exe
          '@ | Set-Content `
            -Path "Executable\StartDummyClient.bat" `
            -Encoding ascii

          @'
          PVENoirGame Dummy Client Package

          Run StartDummyClient.bat after the game server is running.
          '@ | Set-Content `
            -Path "Executable\README.txt" `
            -Encoding utf8

      - name: Verify dummy client package
        shell: powershell
        run: |
          if (-not (Test-Path "Executable\DummyClient\${{ env.DUMMY_CLIENT_EXE }}")) {
              throw "Dummy client executable was not found."
          }

          $protoFiles = Get-ChildItem "Executable" -Recurse -Filter "*.proto" -File -ErrorAction SilentlyContinue
          if ($protoFiles) {
              $protoFiles | Select-Object FullName
              throw "Proto source files should not be included in the executable package."
          }

      - name: Stage artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Artifact"
          Copy-Item "Executable" "Artifact" -Recurse -Force

      - name: Upload dummy client package
        uses: actions/upload-artifact@v4
        with:
          name: PVENoirGame-DummyClient-Windows-x64
          path: Artifact
          if-no-files-found: error
