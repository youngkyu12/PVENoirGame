name: Build Executable Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    env:
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64
      CLIENT_SOLUTION: PracticeProject08-9-1\PracticeProject08-9-1.sln
      SERVER_SOLUTION: GameServer\GameServer.sln
      CLIENT_OUTPUT: PracticeProject08-9-1\x64\Release
      SERVER_OUTPUT: GameServer\x64\Release
      CLIENT_EXE: PracticeProject08-9-1.exe
      SERVER_EXE: GameServer.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract FMOD SDK
        shell: powershell
        run: |
          if (-not (Test-Path "PracticeProject08-9-1\External\FMOD\lib\x64\fmod_vc.lib")) {
              Expand-Archive `
                -Path "PracticeProject08-9-1\External\FMOD.zip" `
                -DestinationPath "PracticeProject08-9-1\External" `
                -Force
          }

      - name: Verify native build dependencies
        shell: powershell
        run: |
          $requiredFiles = @(
              "PracticeProject08-9-1\External\FMOD\lib\x64\fmod_vc.lib",
              "Libraries\Libs\Protobuf\Release\libprotobuf.lib",
              "Libraries\Libs\Protobuf\Release\libprotobuf.dll",
              "Libraries\Libs\LUA\lua55.lib"
          )

          foreach ($file in $requiredFiles) {
              if (-not (Test-Path $file)) {
                  throw "Required native build dependency was not found: $file"
              }
          }

      - name: Restore client solution
        run: msbuild "${{ env.CLIENT_SOLUTION }}" /t:Restore

      - name: Restore server solution
        run: msbuild "${{ env.SERVER_SOLUTION }}" /t:Restore

      - name: Build client
        run: >
          msbuild "${{ env.CLIENT_SOLUTION }}"
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}

      - name: Build server
        run: >
          msbuild "${{ env.SERVER_SOLUTION }}"
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}

      - name: Create package directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Executable\Client"
          New-Item -ItemType Directory -Force -Path "Executable\Server"

      - name: Copy client executable and DLLs
        shell: powershell
        run: |
          Copy-Item `
            "${{ env.CLIENT_OUTPUT }}\${{ env.CLIENT_EXE }}" `
            "Executable\Client\${{ env.CLIENT_EXE }}" `
            -Force

          Get-ChildItem `
            -Path "${{ env.CLIENT_OUTPUT }}" `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
          Copy-Item `
            -Destination "Executable\Client" `
            -Force

          if (Test-Path "PracticeProject08-9-1\fmod.dll") {
              Copy-Item "PracticeProject08-9-1\fmod.dll" "Executable\Client\fmod.dll" -Force
          }

          if (Test-Path "Libraries\Libs\Protobuf\Release\libprotobuf.dll") {
              Copy-Item "Libraries\Libs\Protobuf\Release\libprotobuf.dll" "Executable\Client\libprotobuf.dll" -Force
          }

      - name: Copy client resources
        shell: powershell
        run: |
          $clientRoot = "PracticeProject08-9-1"
          $clientPackage = "Executable\Client"

          foreach ($dir in @("Assets", "Image", "MapData", "NetworkSettings")) {
              $src = Join-Path $clientRoot $dir
              if (Test-Path $src) {
                  Copy-Item `
                    $src `
                    (Join-Path $clientPackage $dir) `
                    -Recurse -Force
              }
          }

          Get-ChildItem `
            -Path $clientRoot `
            -Filter "*.hlsl" `
            -File |
          Copy-Item `
            -Destination $clientPackage `
            -Force

      - name: Copy server executable and DLLs
        shell: powershell
        run: |
          Copy-Item `
            "${{ env.SERVER_OUTPUT }}\${{ env.SERVER_EXE }}" `
            "Executable\Server\${{ env.SERVER_EXE }}" `
            -Force

          Get-ChildItem `
            -Path "${{ env.SERVER_OUTPUT }}" `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
          Copy-Item `
            -Destination "Executable\Server" `
            -Force

          if (Test-Path "Libraries\Libs\Protobuf\Release\libprotobuf.dll") {
              Copy-Item "Libraries\Libs\Protobuf\Release\libprotobuf.dll" "Executable\Server\libprotobuf.dll" -Force
          }

          if (Test-Path "Libraries\Libs\LUA\lua55.dll") {
              Copy-Item "Libraries\Libs\LUA\lua55.dll" "Executable\Server\lua55.dll" -Force
          }

      - name: Copy server resources
        shell: powershell
        run: |
          $serverRoot = "GameServer\GameServer"
          $serverPackage = "Executable\Server"

          foreach ($dir in @("MapFIle", "Scripts")) {
              $src = Join-Path $serverRoot $dir
              if (Test-Path $src) {
                  Copy-Item `
                    $src `
                    (Join-Path $serverPackage $dir) `
                    -Recurse -Force
              }
          }

      - name: Create launcher scripts
        shell: powershell
        run: |
          @'
          @echo off
          cd /d "%~dp0Server"
          GameServer.exe
          '@ | Set-Content `
            -Path "Executable\StartServer.bat" `
            -Encoding ascii

          @'
          @echo off
          cd /d "%~dp0Client"
          PracticeProject08-9-1.exe
          '@ | Set-Content `
            -Path "Executable\StartClient.bat" `
            -Encoding ascii

      - name: Create README
        shell: powershell
        run: |
          @'
          PVENoirGame

          1. StartServer.bat을 실행합니다.
          2. 서버 실행 후 StartClient.bat을 실행합니다.

          Client:
          - DirectX 12 client
          - Includes Assets, Image, MapData, NetworkSettings, HLSL files, and DLLs.

          Server:
          - IOCP game server
          - Includes MapFIle and Scripts.
          '@ | Set-Content `
            -Path "Executable\README.txt" `
            -Encoding utf8

      - name: Verify package
        shell: powershell
        run: |
          if (-not (Test-Path "Executable\Client\${{ env.CLIENT_EXE }}")) {
              throw "Client executable was not found."
          }

          if (-not (Test-Path "Executable\Server\${{ env.SERVER_EXE }}")) {
              throw "Server executable was not found."
          }

          $protoFiles = Get-ChildItem "Executable" -Recurse -Filter "*.proto" -File -ErrorAction SilentlyContinue
          if ($protoFiles) {
              $protoFiles | Select-Object FullName
              throw "Proto source files should not be included in the executable package."
          }

          Write-Host "Executable package contents:"
          Get-ChildItem "Executable" -Recurse |
              Select-Object FullName

      - name: Compress package
        shell: powershell
        run: |
          Compress-Archive `
            -Path "Executable" `
            -DestinationPath "PVENoirGame-Windows-x64.zip" `
            -Force

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: PVENoirGame-Windows-x64
          path: PVENoirGame-Windows-x64.zip
          if-no-files-found: error
