name: Build Executable Package

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION_PATH: GraduationProject.sln
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # NuGet packages.config 또는 PackageReference를 사용한다면 필요
      - name: Restore NuGet packages
        run: msbuild "${{ env.SOLUTION_PATH }}" /t:Restore

      - name: Build solution
        run: >
          msbuild "${{ env.SOLUTION_PATH }}"
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}

      - name: Create Executable directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Executable\Client"
          New-Item -ItemType Directory -Force -Path "Executable\Server"

      - name: Copy client executable
        shell: powershell
        run: |
          Copy-Item `
            "Client\x64\Release\GraduationProject.exe" `
            "Executable\Client\GraduationProject.exe" `
            -Force

      - name: Copy client resources
        shell: powershell
        run: |
          if (Test-Path "Client\Assets") {
              Copy-Item `
                "Client\Assets" `
                "Executable\Client\Assets" `
                -Recurse -Force
          }

          if (Test-Path "Client\Shaders") {
              Copy-Item `
                "Client\Shaders" `
                "Executable\Client\Shaders" `
                -Recurse -Force
          }

          if (Test-Path "Client\Config") {
              Copy-Item `
                "Client\Config" `
                "Executable\Client\Config" `
                -Recurse -Force
          }

      - name: Copy client DLLs
        shell: powershell
        run: |
          $clientOutput = "Client\x64\Release"

          if (Test-Path $clientOutput) {
              Get-ChildItem `
                -Path $clientOutput `
                -Filter "*.dll" `
                -File `
                -ErrorAction SilentlyContinue |
              Copy-Item `
                -Destination "Executable\Client" `
                -Force
          }

      - name: Copy server executable
        shell: powershell
        run: |
          Copy-Item `
            "Server\x64\Release\GameServer.exe" `
            "Executable\Server\GameServer.exe" `
            -Force

      - name: Copy server resources
        shell: powershell
        run: |
          if (Test-Path "Server\Config") {
              Copy-Item `
                "Server\Config" `
                "Executable\Server\Config" `
                -Recurse -Force
          }

          if (Test-Path "Server\Data") {
              Copy-Item `
                "Server\Data" `
                "Executable\Server\Data" `
                -Recurse -Force
          }

      - name: Copy server DLLs
        shell: powershell
        run: |
          $serverOutput = "Server\x64\Release"

          if (Test-Path $serverOutput) {
              Get-ChildItem `
                -Path $serverOutput `
                -Filter "*.dll" `
                -File `
                -ErrorAction SilentlyContinue |
              Copy-Item `
                -Destination "Executable\Server" `
                -Force
          }

      - name: Create launcher scripts
        shell: powershell
        run: |
          @'
          @echo off
          cd /d "%~dp0Server"
          GameServer.exe
          '@ | Set-Content `
            -Path "Executable\StartServer.bat" `
            -Encoding ascii

          @'
          @echo off
          cd /d "%~dp0Client"
          GraduationProject.exe
          '@ | Set-Content `
            -Path "Executable\StartClient.bat" `
            -Encoding ascii

      - name: Create README
        shell: powershell
        run: |
          @'
          Graduation Project

          1. StartServer.bat을 실행합니다.
          2. 서버 실행 후 StartClient.bat을 실행합니다.

          Client:
          - DirectX 12 클라이언트

          Server:
          - IOCP 기반 게임 서버
          '@ | Set-Content `
            -Path "Executable\README.txt" `
            -Encoding utf8

      - name: Verify package
        shell: powershell
        run: |
          if (-not (Test-Path "Executable\Client\GraduationProject.exe")) {
              throw "Client executable was not found."
          }

          if (-not (Test-Path "Executable\Server\GameServer.exe")) {
              throw "Server executable was not found."
          }

          Write-Host "Executable package contents:"
          Get-ChildItem "Executable" -Recurse |
              Select-Object FullName

      - name: Compress package
        shell: powershell
        run: |
          Compress-Archive `
            -Path "Executable" `
            -DestinationPath "GraduationProject-Windows-x64.zip" `
            -Force

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: GraduationProject-Windows-x64
          path: GraduationProject-Windows-x64.zip
          if-no-files-found: error
