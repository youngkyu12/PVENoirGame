syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";
import "InitStruct.proto";

message C_LOGIN
{
	
}

message S_LOGIN
{
	bool success = 1;
	repeated Player players = 2;	// Before player id assignment
	uint32 playerId = 3;	// Assigned player id
}

message C_ENTER_GAME
{
	uint64 playerId = 1;
	uint32 playerWeapon = 2;
	bool ready = 3;
}

message S_ENTER_GAME
{
	repeated Player players = 1;
	repeated bool ready = 2;
}

message C_GAME_START
{
	uint32 playerId = 1;
	uint32 playerWeapon = 2;
	bool ready = 3;
}

message S_GAME_START
{
	// Initial dynamic world manifest.
	InitStruct initStruct = 1;
	string mapId = 2;
}

// Sent after the client finishes loading and is ready to play.
message C_CLIENT_READY
{
	uint32 playerId = 1;
	bool ready = 2;
}

message C_INPUT
{
	// Keyboard input bits.
	// 0: up, 1: down, 2: left, 3: right, 4: attack
	// Mouse input deltas.
	// deltaX, deltaY

	uint64 playerid = 1;
	int32 keyCodes = 2; 
	float deltaX = 3;
	float deltaY = 4;
	float clientDeltaTime = 5;
}

message S_FRAME_STATE
{
	// Server-authoritative frame snapshot.
	uint32 serverTick = 1;
	repeated Player players = 2;
	repeated Enemy enemies = 3;
	repeated Bullet bullets = 4;
	BossRoomState bossRoomState = 5;
}

message S_FORCED_TRANSFORM
{
	uint64 playerId = 1;
	float yawDelta = 2;
	ForcedTransformReason reason = 3;
}

message C_DEBUG_COMMAND
{
	DebugCommandType commandType = 1;
}
